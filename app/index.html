<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E2E9E1; --ink:#0F2119; --muted:#56685E; --line:#D2DBD2;
  --grass:#1E6B43; --grass-ink:#FFFFFF; --grass-soft:#D6E8DC; --flag:#E8B923; --flag-ink:#1C1600;
  --danger:#B3402E; --ok:#1E7A48; --shadow:0 1px 2px rgba(15,33,25,.06),0 8px 24px rgba(15,33,25,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A140F;--surface:#12201A;--surface-2:#1A2B22;--ink:#E4EDE6;--muted:#93A79B;--line:#243629;
  --grass:#43A870;--grass-ink:#04120A;--grass-soft:#183526;--flag:#F2C94C;--flag-ink:#1C1600;--danger:#E27560;--ok:#55B982;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A140F;--surface:#12201A;--surface-2:#1A2B22;--ink:#E4EDE6;--muted:#93A79B;--line:#243629;
  --grass:#43A870;--grass-ink:#04120A;--grass-soft:#183526;--flag:#F2C94C;--flag-ink:#1C1600;--danger:#E27560;--ok:#55B982;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px;border-radius:6px}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.wrap{padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:750;line-height:1.1}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:650;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
.topbar.line{border-bottom-color:var(--line)}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--flag);display:inline-block;box-shadow:0 0 0 3px var(--grass)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--grass);color:var(--grass-ink);font-weight:700;font-size:13px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:8px 0;text-align:center;display:flex;flex-direction:column;gap:1px}
.day b{font-family:var(--display);font-size:18px;font-weight:700}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.day[aria-pressed="true"]{background:var(--grass);border-color:var(--grass);color:var(--grass-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ccard{display:flex;flex-direction:column;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s}
.ccard:hover{transform:translateY(-1px)}
.art{display:block;width:100%;height:112px}
.ccard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:650}
.times{display:flex;gap:6px;flex-wrap:wrap}
.tpill{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:8px;background:var(--grass-soft);color:var(--ink)}
.price{font-family:var(--display);font-weight:700;font-size:17px}
.hcp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--flag) 22%,var(--surface));color:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stat3>div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat3>div+div{border-left:1px solid var(--line)}
.stat3 b{font-family:var(--display);font-size:20px;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:9px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:42px}
.stepper button{width:40px;height:100%;font-size:20px;font-weight:600}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.slot .t{font-family:var(--mono);font-weight:600;font-size:15px}
.slot .p{font-size:12.5px;font-weight:600}
.slot .s{font-size:11px;color:var(--muted)}
.slot:disabled{opacity:.38;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--grass);color:var(--grass-ink);border-color:var(--grass)}
.slot[aria-pressed="true"] .s{color:inherit;opacity:.8}
.slot .twi{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--flag)}
.slot[aria-pressed="true"] .twi{color:var(--flag)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(100%,460px);padding:10px 16px;z-index:8}
.btn{height:50px;border-radius:14px;padding:0 18px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--grass);color:var(--grass-ink);width:100%;box-shadow:var(--shadow)}
.btn.flag{background:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.sm{height:38px;border-radius:10px;font-size:14px;padding:0 14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.li+.li{border-top:1px solid var(--line)}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--grass);border-color:var(--grass)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.sum{display:flex;flex-direction:column;gap:6px;padding:14px}
.sum .row{justify-content:space-between}
.sum .total{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--flag) 25%,var(--surface))}
.pill.lvl{background:var(--ink);color:var(--bg)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;min-width:0}

.seat .c.me{background:var(--grass);color:var(--grass-ink)}
.seat .c.open{background:none;border:1.5px dashed var(--muted);color:var(--muted);font-size:20px}
.seat .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hibox{background:var(--grass);color:var(--grass-ink);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end;position:relative;overflow:hidden}
.hibox .big{font-family:var(--display);font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.03em}
.hibox .label{color:inherit;opacity:.8}
.hibox svg{grid-column:1/-1;width:100%;height:64px;display:block}
.rd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rd .g{font-family:var(--display);font-size:22px;font-weight:700;width:44px;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--flag)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.tabbar button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--grass)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--grass)}
.tabbar svg{width:22px;height:22px}
.badge{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--flag);color:var(--flag-ink);font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.overlay{position:fixed;inset:0;background:rgba(5,15,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(100%,460px);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ccard{transition:none}}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.sc{overflow-x:auto}
.sc table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;text-align:center}
.sc th,.sc td{padding:6px 2px;border-bottom:1px solid var(--line)}
.sc th{font-weight:600;color:var(--muted);text-align:left;font-family:var(--body);font-size:12px;padding-right:6px}
.sc .tot{font-weight:700;background:var(--surface-2)}
.s{display:inline-grid;place-items:center;width:24px;height:24px}
.s.b{border:1.5px solid var(--grass);border-radius:50%}
.s.e{border:1.5px solid var(--grass);border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--grass)}
.s.bo{border:1.5px solid var(--muted)}
.s.db{border:1.5px solid var(--muted);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
.note{font-size:12px;color:var(--muted);text-align:center}
.formula{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

.onb{min-height:100%;display:flex;flex-direction:column}
.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}

.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}

.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
.opt[aria-pressed="true"] .radio{border:6px solid var(--grass)}
.otp{font-family:var(--mono);font-size:28px;letter-spacing:.45em;text-align:center;height:60px!important}
.check{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px}
.check+.check{border-top:1px solid var(--line)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800}
.check[aria-checked="true"] .box{background:var(--grass);border-color:var(--grass);color:var(--grass-ink)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ccard{position:relative}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(6,20,12,.45);color:#fff;display:grid;place-items:center}
.fav[aria-pressed="true"]{color:#F2C94C}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.iconbtn[aria-pressed="true"]{color:var(--flag)}
.dotb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--flag);color:var(--flag-ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

.wx{display:flex;align-items:center;gap:12px;padding:12px 14px}
.wx b{font-family:var(--display);font-size:26px;font-weight:750}
.nitem{display:flex;gap:12px;padding:14px;align-items:flex-start}
.nitem+.nitem{border-top:1px solid var(--line)}
.nitem .ud{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:transparent}
.nitem.unread .ud{background:var(--flag)}
.ok-card{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--surface))}

textarea{font:inherit;color:inherit}

function spark(series){if(series.length<2)return'';const w=400,hgt=64,pad=6;const mn=Math.min(...series),mx=Math.max(...series);const rngv=mx-mn||1;const pts=series.map((v,i)=>[pad+i*(w-2*pad)/(series.length-1),pad+(v-mn)/rngv*(hgt-2*pad)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];

 case'idea-add':{const t=IF.title.trim();if(t.length<5){toast('Describe your idea in a few words first');break}const club=S.mode==='club';const idea={id:'i'+Date.now(),from:club?'club':'player',cat:IF.cat,title:t,body:IF.body.trim(),votes:1,voted:true,mine:true,status:'review',t:Date.now()};S.ideas.push(idea);IF={title:'',body:'',cat:IF.cat};S.ifilter='mine';S.isort='new';save();render();toast('Thanks — the Fourball team reads every idea');
  setTimeout(()=>{idea.reply='Thanks for this! We’ve added it to our review list — upvotes help us decide what to build next.';if(!club)pushN('sys','Reply to your idea',`“${t}” — the Fourball team replied.`);save();if(['ideas'].includes(club?S.cview:S.view))render()},5000);break}
 case'wait':{S.waitlist=S.waitlist||[];const ds=iso(dayDate(S.dayIdx));const i=S.waitlist.findIndex(w=>w.course===v&&w.date===ds);if(i>=0){S.waitlist.splice(i,1);save();render();toast('Removed from waitlist');break}S.waitlist.push({course:v,date:ds});save();render();toast('You’re on the waitlist');const c=CBY[v],di=S.dayIdx;setTimeout(()=>{if(!(S.waitlist||[]).some(w=>w.course===v&&w.date===ds))return;pushN('book','A tee time just opened',`${c.name} · ${dLabel(dayDate(di))} 11:40 — book before someone else does.`);save();if(S.mode==='player'&&S.user)render();toast(`Tee time opened at ${c.name} · 11:40`)},8000);break}
 case'plus':S.user.plusNotify=true;save();render();toast('We’ll let you know when Fourball Plus launches');break;
 case'pm':S.pm=v;render();break;
 case'dnav':S.dstart=Math.max(0,Math.min(365,S.dstart+ +v));S.dayIdx=S.dstart;S.slot=null;render();break;
 case'stu':SV=freshSV();mStu();break;
 case'sv':SV.step=v;SV.err='';mStu();break;
 case'sv-send':SV.err='';if(!/^\S+@\S+\.\S+$/.test(SV.email.trim())||!uniOf(SV.email.trim())){SV.err='Use your university email ending in .ac.za — or verify with your student card';mStu();break}SV.email=SV.email.trim();SV.code='';SV.step='code';mStu();toast('Code sent (demo)');break;
 case'sv-code':SV.err='';if(!/^\d{6}$/.test(SV.code)){SV.err='Enter the 6-digit code';mStu();break}S.user.student={status:'verified',method:'email',inst:uniOf(SV.email),email:SV.email,until:stuUntil()};pushN('sys','Student status verified',`${S.user.student.inst} · student rates apply until ${fmtD(stuUntil())}.`);save();render();SV.step='done';SV.pending=false;mStu();break;
 case'sv-card':SV.err='';if(!SV.file){SV.err='Add a photo of your student card';mStu();break}S.user.student={status:'pending',method:'card',inst:SV.inst};save();render();SV.pending=true;SV.step='done';mStu();setTimeout(()=>{const st=S.user&&S.user.student;if(st&&st.status==='pending'&&S.hq.auto!==false){st.status='verified';st.until=stuUntil();pushN('sys','Student status verified',`${st.inst} · student rates apply until ${fmtD(st.until)}.`);save();render();toast('Student status verified')}},4000);break;
 case'stu-rm':S.user.student=null;save();render();break;
 case'mem-add':MV={};mMem();break;
 case'mem-go':{const c=CBY[MV.club];if(!c)break;const u=S.user;u.memberships=u.memberships||[];const auto=u.hiSource==='hna'&&u.club===c.id;const m={club:c.id,type:MV.type||'Full member',no:MV.no||'',status:auto?'verified':'pending',via:auto?'Matched to your HNA home club':''};u.memberships.push(m);
  if(!auto&&c.id==='myclub'&&S.club){S.club.requests.push({id:'rq'+Date.now(),n:u.name,hna:u.hna||'',type:m.type,hi:myHI(),app:true,fromUser:true});S.club.feed.push({t:Date.now(),text:`${u.name} asked to link their ${m.type.toLowerCase()}ship`})}
  else if(!auto)setTimeout(()=>{const mm=((S.user&&S.user.memberships)||[]).find(x=>x.club===c.id&&x.status==='pending');if(mm){mm.status='verified';mm.via='Confirmed by the club';pushN('sys','Membership confirmed',`${c.name} confirmed your ${mm.type.toLowerCase()}ship. Member rates now apply.`);save();render();toast(`${c.name} confirmed your membership`)}},3500);
  save();closeModal();render();toast(auto?'Membership verified':'Request sent to '+c.name);break}
 case'mem-rm':{S.user.memberships=(S.user.memberships||[]).filter(m=>m.club!==v);if(v==='myclub'&&S.club)S.club.requests=S.club.requests.filter(r=>!r.fromUser);save();render();break}
 case'close':closeModal();break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.cof){e.preventDefault();const b=$('#app .btn.primary:not([disabled])');if(b)b.click();return}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f){e.preventDefault();const b=e.target.id==='obHna'?$('#app [data-a="ob-verify"]'):$('#app .btn.primary:not([disabled])');if(b)b.click()}});
document.addEventListener('input',e=>{if(e.target.id==='mq'){S.mq=e.target.value;const pos=e.target.selectionStart;render();const n=$('#mq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
 const iff=e.target.dataset&&e.target.dataset.if;if(iff){IF[iff]=e.target.value;return}const sv=e.target.dataset&&e.target.dataset.sv;if(sv){SV[sv]=e.target.value;return}const mv=e.target.dataset&&e.target.dataset.mv;if(mv){MV[mv]=e.target.value;return}
 const cof=e.target.dataset&&e.target.dataset.cof;if(cof){CO[cof]=e.target.value;if(CO.step==='c-price'){const pv=$('#cPrev');if(pv)pv.innerHTML=pricePreview()}return}const f=e.target.dataset&&e.target.dataset.f;if(f){O[f]=e.target.value;if(f==='hna')O.verify=0}});
document.addEventListener('change',e=>{const id=e.target.id;const ds=e.target.dataset||{};
 if(ds.hqstage){S.hq.pipeline[ds.hqstage]=e.target.value;save();render();toast('Stage updated');return}
 if(ds.hqidea){const i=S.ideas.find(x=>x.id===ds.hqidea);if(i){i.status=e.target.value;save();render();toast('Status updated')}return}
 if(ds.hq){const val=parseFloat(e.target.value);const max=ds.hq==='pricing.commission'?20:200;if(!(val>=0&&val<=max)){toast(ds.hq==='pricing.commission'?'Commission must be between 0 and 20%':'Booking fee must be between R0 and R200');render();return}setP('hq.'+ds.hq,val);applyPricing();save();render();toast('Pricing updated');return}

 if(id==='cJump'&&e.target.value){const off=Math.round((new Date(e.target.value+'T00:00')-TODAY)/864e5);S.cday=off;S.cstart=off;render();return}
 if(id==='pJump'&&e.target.value){const off=Math.max(0,Math.min(365,Math.round((new Date(e.target.value+'T00:00')-TODAY)/864e5)));S.dayIdx=off;S.dstart=off;S.slot=null;render();return}
 if(id==='svFile'){SV.file=e.target.files&&e.target.files[0]?e.target.files[0].name:null;mStu();return}
 if(id==='cCsv'&&e.target.files&&e.target.files[0]&&S.club){const fr=new FileReader();fr.onload=()=>{const rows=String(fr.result).split(/\r?\n/).map(l=>l.split(/[,;]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&!/^name$/i.test(r[0]));rows.forEach((r,i)=>S.club.members.push({id:'mi'+Date.now()+i,n:r[0],type:r[1]||'Full',hna:r[2]||'—',hi:null,app:false}));save();render();toast(`${rows.length} member${rows.length===1?'':'s'} imported`)};fr.readAsText(e.target.files[0]);return}
const cf=e.target.dataset&&e.target.dataset.cf;if(cf&&S.club){let val=e.target.value;const nums=['fee','wkend','cartFee','par','cr','slope','twiPct','interval','cancel','nineFee','nineWk','advance','memberAdvance','memberFee','memberWk','guestFee','student.pct','minPlayers','twiFee','twiWk','length','student.fee','student.nine'];if((cf==='twiPct'||cf==='student.pct')&&!(+val>=0&&+val<=90)){toast('Enter a percentage between 0 and 90');render();return}if((cf==='advance'||cf==='memberAdvance')&&!(+val>=1&&+val<=730)){toast('Enter between 1 and 730 days');render();return}if(nums.includes(cf)){val=parseFloat(val);if(!(val>=0)){toast('Enter a number');render();return}}if(cf==='name'&&val.trim().length<3){toast('Club name needs at least 3 characters');render();return}if((cf==='first'||cf==='last'||cf==='twiStart'||cf==='memOnlyUntil')&&!/^\d\d:\d\d$/.test(val)){render();return}setP('club.'+cf,typeof val==='string'?val.trim():val);registerClubCourse();save();render();toast('Saved');return}const f=e.target.dataset&&e.target.dataset.f;if(f&&e.target.tagName==='SELECT')O[f]=e.target.value;const sf=e.target.dataset&&e.target.dataset.sf;if(sf){let val=e.target.value;if(sf==='user.name'){val=val.trim();if(val.length<2){toast('Name needs at least 2 characters');render();return}}setP(sf,val);save();render();toast('Saved')}});
if(location.hash==='#club')S.mode='club';else if(location.hash==='#hq')S.mode='hq';else S.mode='player';
if(S.club&&S.club.status==='review'){CO.step='c-review';setTimeout(approveClub,3500)}
render();
})();
